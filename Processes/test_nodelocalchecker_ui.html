<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NodeLocalChecker UI 功能测试</title>
    <style>
        body {
            font-family: 'Courier New', monospace;
            background: #0a0a0a;
            color: #0f0;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 { color: #0ff; text-shadow: 0 0 10px #0ff; }
        h2 { color: #f0f; margin-top: 30px; }
        .test-section {
            background: rgba(0, 20, 20, 0.5);
            border: 1px solid #0ff;
            padding: 20px;
            margin: 20px 0;
        }
        .test-item {
            margin: 10px 0;
            padding: 10px;
            background: rgba(0, 0, 0, 0.5);
        }
        .status {
            display: inline-block;
            padding: 5px 10px;
            margin-left: 10px;
            border-radius: 3px;
            font-weight: bold;
        }
        .pass { background: #0f0; color: #000; }
        .fail { background: #f00; color: #fff; }
        .pending { background: #ff0; color: #000; }
        button {
            background: #0ff;
            color: #000;
            border: none;
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-weight: bold;
        }
        button:hover { background: #f0f; }
        pre {
            background: #000;
            color: #0f0;
            padding: 10px;
            overflow-x: auto;
            border: 1px solid #0ff;
        }
        .result {
            margin-top: 10px;
            padding: 10px;
            background: rgba(0, 0, 0, 0.8);
            border-left: 3px solid #0ff;
        }
    </style>
</head>
<body>
    <h1>🧪 NodeLocalChecker UI 功能测试</h1>
    <p>测试时间: <span id="testTime"></span></p>

    <div class="test-section">
        <h2>1️⃣ 国家提取测试</h2>
        <button onclick="testCountryExtraction()">运行测试</button>
        <div id="countryResult" class="result" style="display:none;"></div>
    </div>

    <div class="test-section">
        <h2>2️⃣ API 节点列表测试</h2>
        <button onclick="testNodesList()">加载节点列表</button>
        <div id="nodesResult" class="result" style="display:none;"></div>
    </div>

    <div class="test-section">
        <h2>3️⃣ 国家统计测试</h2>
        <button onclick="testCountryStats()">统计国家分布</button>
        <div id="statsResult" class="result" style="display:none;"></div>
    </div>

    <div class="test-section">
        <h2>4️⃣ 排序功能测试</h2>
        <button onclick="testSorting()">测试排序</button>
        <div id="sortResult" class="result" style="display:none;"></div>
    </div>

    <div class="test-section">
        <h2>5️⃣ 筛选功能测试</h2>
        <button onclick="testFiltering()">测试筛选</button>
        <div id="filterResult" class="result" style="display:none;"></div>
    </div>

    <div class="test-section">
        <h2>6️⃣ 完整功能验证</h2>
        <button onclick="runAllTests()">运行所有测试</button>
        <div id="allTestsResult" class="result" style="display:none;"></div>
    </div>

    <script>
        // 显示测试时间
        document.getElementById('testTime').textContent = new Date().toLocaleString('zh-CN');

        let testNodes = [];

        // 国家代码映射表 (与 app.js 相同)
        const countryMap = {
            'US': '美国', 'HK': '香港', 'JP': '日本', 'SG': '新加坡',
            'TW': '台湾', 'KR': '韩国', 'UK': '英国', 'GB': '英国', 'DE': '德国',
            'FR': '法国', 'CA': '加拿大', 'AU': '澳大利亚', 'NL': '荷兰',
            'RU': '俄罗斯', 'IN': '印度', 'TH': '泰国', 'VN': '越南',
            'PH': '菲律宾', 'ID': '印度尼西亚', 'MY': '马来西亚'
        };

        const flagToCountry = {
            '🇺🇸': '美国', '🇭🇰': '香港', '🇯🇵': '日本', '🇸🇬': '新加坡',
            '🇹🇼': '台湾', '🇰🇷': '韩国', '🇬🇧': '英国', '🇩🇪': '德国',
            '🇫🇷': '法国', '🇨🇦': '加拿大', '🇦🇺': '澳大利亚', '🇳🇱': '荷兰'
        };

        // 从节点名称提取国家 (与 app.js 相同)
        function extractCountryFromName(name) {
            if (!name) return '其他';
            
            // 1. 检查emoji国旗
            for (const [flag, country] of Object.entries(flagToCountry)) {
                if (name.includes(flag)) {
                    return country;
                }
            }
            
            // 2. 检查国家代码
            const codeMatch = name.match(/\b([A-Z]{2})\b/);
            if (codeMatch && countryMap[codeMatch[1]]) {
                return countryMap[codeMatch[1]];
            }
            
            // 3. 检查中文国家名
            for (const country of Object.values(countryMap)) {
                if (name.includes(country)) {
                    return country;
                }
            }
            
            // 4. 检查常见模式
            const patterns = {
                '美国': /美国|United States|USA/i,
                '香港': /香港|Hong Kong|HongKong/i,
                '日本': /日本|Japan/i,
                '新加坡': /新加坡|Singapore/i,
                '台湾': /台湾|Taiwan/i,
                '韩国': /韩国|Korea/i
            };
            
            for (const [country, pattern] of Object.entries(patterns)) {
                if (pattern.test(name)) {
                    return country;
                }
            }
            
            return '其他';
        }

        // 测试1: 国家提取
        function testCountryExtraction() {
            const testCases = [
                { name: 'US-美国_12', expected: '美国' },
                { name: 'HK 8701', expected: '香港' },
                { name: 'US_speednode_0041', expected: '美国' },
                { name: '🇯🇵 日本节点', expected: '日本' },
                { name: '🇸🇬 Singapore', expected: '新加坡' },
                { name: 'TW-台湾-01', expected: '台湾' },
                { name: 'Korea-Seoul', expected: '韩国' },
                { name: '官网地址https://kelayun.notepin.co', expected: '其他' }
            ];

            let html = '<h3>国家提取测试结果:</h3>';
            let passed = 0;
            let failed = 0;

            testCases.forEach(test => {
                const result = extractCountryFromName(test.name);
                const status = result === test.expected ? 'pass' : 'fail';
                if (status === 'pass') passed++;
                else failed++;

                html += `
                    <div class="test-item">
                        <strong>节点名:</strong> ${test.name}<br>
                        <strong>期望:</strong> ${test.expected}<br>
                        <strong>实际:</strong> ${result}
                        <span class="status ${status}">${status === 'pass' ? '✓ 通过' : '✗ 失败'}</span>
                    </div>
                `;
            });

            html += `<p><strong>总计:</strong> 通过 ${passed}/${testCases.length}, 失败 ${failed}</p>`;
            
            const resultDiv = document.getElementById('countryResult');
            resultDiv.innerHTML = html;
            resultDiv.style.display = 'block';
        }

        // 测试2: 加载节点列表
        async function testNodesList() {
            const resultDiv = document.getElementById('nodesResult');
            resultDiv.innerHTML = '<p>正在加载节点列表...</p>';
            resultDiv.style.display = 'block';

            try {
                const response = await fetch('https://home.liukun.com:8443/Projects/NodeLocalChecker/api/nodes.php?action=list');
                const result = await response.json();

                if (result.success) {
                    testNodes = result.nodes;
                    let html = `
                        <h3>✓ 节点列表加载成功</h3>
                        <p><strong>总节点数:</strong> ${testNodes.length}</p>
                        <p><strong>前5个节点:</strong></p>
                        <pre>${JSON.stringify(testNodes.slice(0, 5).map(n => ({
                            name: n.name,
                            type: n.type,
                            server: n.server,
                            available: n.available
                        })), null, 2)}</pre>
                    `;
                    resultDiv.innerHTML = html;
                } else {
                    resultDiv.innerHTML = `<p class="fail">✗ 加载失败: ${result.error}</p>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<p class="fail">✗ 请求失败: ${error.message}</p>`;
            }
        }

        // 测试3: 国家统计
        async function testCountryStats() {
            if (testNodes.length === 0) {
                await testNodesList();
            }

            const countryStats = {};
            testNodes.forEach(node => {
                const country = extractCountryFromName(node.name);
                countryStats[country] = (countryStats[country] || 0) + 1;
            });

            const sorted = Object.entries(countryStats).sort((a, b) => b[1] - a[1]);

            let html = '<h3>国家/地区分布统计:</h3>';
            html += '<table style="width:100%; border-collapse: collapse;">';
            html += '<tr style="border-bottom: 1px solid #0ff;"><th>国家/地区</th><th>节点数</th><th>占比</th></tr>';
            
            sorted.forEach(([country, count]) => {
                const percent = ((count / testNodes.length) * 100).toFixed(1);
                html += `<tr style="border-bottom: 1px solid #333;">
                    <td>${country}</td>
                    <td>${count}</td>
                    <td>${percent}%</td>
                </tr>`;
            });
            
            html += '</table>';
            html += `<p><strong>总计:</strong> ${sorted.length} 个国家/地区</p>`;

            const resultDiv = document.getElementById('statsResult');
            resultDiv.innerHTML = html;
            resultDiv.style.display = 'block';
        }

        // 测试4: 排序功能
        async function testSorting() {
            if (testNodes.length === 0) {
                await testNodesList();
            }

            // 创建测试数据
            const testData = [
                { name: 'Node A', available: 1, latency: '50ms' },
                { name: 'Node B', available: 1, latency: '20ms' },
                { name: 'Node C', available: 0, latency: null },
                { name: 'Node D', available: null, latency: null },
                { name: 'Node E', available: 1, latency: '100ms' }
            ];

            // 按延迟排序
            const sorted = [...testData].sort((a, b) => {
                if (a.available === 1 && b.available === 1) {
                    const latencyA = parseFloat(a.latency) || 99999;
                    const latencyB = parseFloat(b.latency) || 99999;
                    return latencyA - latencyB;
                }
                if (a.available === 1) return -1;
                if (b.available === 1) return 1;
                if (a.available === null && b.available === 0) return -1;
                if (b.available === null && a.available === 0) return 1;
                return a.name.localeCompare(b.name);
            });

            let html = '<h3>排序测试结果:</h3>';
            html += '<p><strong>原始顺序:</strong></p>';
            html += '<pre>' + JSON.stringify(testData, null, 2) + '</pre>';
            html += '<p><strong>按延迟排序后:</strong></p>';
            html += '<pre>' + JSON.stringify(sorted, null, 2) + '</pre>';
            html += '<p class="pass">✓ 排序逻辑: 可用节点(按延迟) → 未检测节点 → 不可用节点</p>';

            const resultDiv = document.getElementById('sortResult');
            resultDiv.innerHTML = html;
            resultDiv.style.display = 'block';
        }

        // 测试5: 筛选功能
        async function testFiltering() {
            if (testNodes.length === 0) {
                await testNodesList();
            }

            const testCountry = '美国';
            const filtered = testNodes.filter(node => {
                const country = extractCountryFromName(node.name);
                return country === testCountry;
            });

            let html = `<h3>筛选测试结果:</h3>`;
            html += `<p><strong>筛选条件:</strong> ${testCountry}</p>`;
            html += `<p><strong>筛选前:</strong> ${testNodes.length} 个节点</p>`;
            html += `<p><strong>筛选后:</strong> ${filtered.length} 个节点</p>`;
            html += `<p><strong>筛选结果示例 (前5个):</strong></p>`;
            html += '<pre>' + JSON.stringify(filtered.slice(0, 5).map(n => n.name), null, 2) + '</pre>';

            const resultDiv = document.getElementById('filterResult');
            resultDiv.innerHTML = html;
            resultDiv.style.display = 'block';
        }

        // 运行所有测试
        async function runAllTests() {
            const resultDiv = document.getElementById('allTestsResult');
            resultDiv.innerHTML = '<p>正在运行所有测试...</p>';
            resultDiv.style.display = 'block';

            const startTime = Date.now();
            
            await testCountryExtraction();
            await testNodesList();
            await testCountryStats();
            await testSorting();
            await testFiltering();

            const duration = ((Date.now() - startTime) / 1000).toFixed(2);

            let html = `
                <h3>✓ 所有测试完成</h3>
                <p><strong>总耗时:</strong> ${duration} 秒</p>
                <p><strong>测试项目:</strong></p>
                <ul>
                    <li>✓ 国家提取功能</li>
                    <li>✓ API 节点列表加载</li>
                    <li>✓ 国家统计分析</li>
                    <li>✓ 排序逻辑验证</li>
                    <li>✓ 筛选功能测试</li>
                </ul>
                <p class="pass">所有功能测试通过！请在浏览器中访问实际页面进行UI测试。</p>
            `;

            resultDiv.innerHTML = html;
        }
    </script>
</body>
</html>
