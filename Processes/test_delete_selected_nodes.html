<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>测试清除所选节点功能</title>
    <style>
        body {
            font-family: 'Courier New', monospace;
            background: #0a0a0a;
            color: #00ff41;
            padding: 20px;
        }
        .test-section {
            background: rgba(0, 20, 20, 0.5);
            border: 2px solid #00ffff;
            padding: 20px;
            margin-bottom: 20px;
        }
        h2 {
            color: #00ffff;
            text-shadow: 0 0 10px #00ffff;
        }
        button {
            background: rgba(0, 255, 255, 0.1);
            color: #00ffff;
            border: 2px solid #00ffff;
            padding: 10px 20px;
            cursor: pointer;
            margin: 5px;
            font-family: 'Courier New', monospace;
        }
        button:hover {
            background: rgba(0, 255, 255, 0.2);
        }
        pre {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid #00ff41;
            padding: 10px;
            overflow-x: auto;
            color: #00ff41;
        }
        .success { color: #0f0; }
        .error { color: #f00; }
        .info { color: #0ff; }
    </style>
</head>
<body>
    <h1>🧪 测试清除所选节点功能</h1>
    
    <div class="test-section">
        <h2>1. 获取节点列表</h2>
        <button onclick="getNodes()">获取节点</button>
        <pre id="nodesResult">点击按钮获取节点列表...</pre>
    </div>
    
    <div class="test-section">
        <h2>2. 删除测试节点</h2>
        <p class="info">⚠️ 这将删除前3个节点作为测试</p>
        <button onclick="deleteTestNodes()">删除前3个节点</button>
        <pre id="deleteResult">点击按钮测试删除功能...</pre>
    </div>
    
    <div class="test-section">
        <h2>3. 验证删除结果</h2>
        <button onclick="verifyDeletion()">验证删除</button>
        <pre id="verifyResult">点击按钮验证删除结果...</pre>
    </div>

    <script>
        let testNodeHashes = [];
        
        async function getNodes() {
            const resultEl = document.getElementById('nodesResult');
            resultEl.textContent = '正在获取节点列表...';
            
            try {
                const response = await fetch('https://home.liukun.com:8443/Projects/NodeLocalChecker/api/nodes.php?action=list');
                const result = await response.json();
                
                if (result.success) {
                    const nodes = result.nodes;
                    testNodeHashes = nodes.slice(0, 3).map(n => n.node_hash);
                    
                    resultEl.innerHTML = `<span class="success">✓ 成功获取 ${nodes.length} 个节点</span>\n\n`;
                    resultEl.innerHTML += `前3个节点:\n`;
                    nodes.slice(0, 3).forEach((node, i) => {
                        resultEl.innerHTML += `\n${i + 1}. ${node.name}\n`;
                        resultEl.innerHTML += `   Hash: ${node.node_hash}\n`;
                        resultEl.innerHTML += `   状态: ${node.available === 1 ? '可用' : node.available === 0 ? '不可用' : '未检测'}\n`;
                    });
                } else {
                    resultEl.innerHTML = `<span class="error">✗ 获取失败: ${result.error}</span>`;
                }
            } catch (error) {
                resultEl.innerHTML = `<span class="error">✗ 请求失败: ${error.message}</span>`;
            }
        }
        
        async function deleteTestNodes() {
            const resultEl = document.getElementById('deleteResult');
            
            if (testNodeHashes.length === 0) {
                resultEl.innerHTML = `<span class="error">✗ 请先获取节点列表</span>`;
                return;
            }
            
            resultEl.textContent = `正在删除 ${testNodeHashes.length} 个节点...`;
            
            try {
                const response = await fetch('https://home.liukun.com:8443/Projects/NodeLocalChecker/api/nodes.php?action=delete', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        node_hashes: testNodeHashes
                    })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    resultEl.innerHTML = `<span class="success">✓ 删除成功</span>\n\n`;
                    resultEl.innerHTML += `删除的节点数: ${result.deleted}\n`;
                    resultEl.innerHTML += `节点Hash列表:\n`;
                    testNodeHashes.forEach((hash, i) => {
                        resultEl.innerHTML += `${i + 1}. ${hash}\n`;
                    });
                } else {
                    resultEl.innerHTML = `<span class="error">✗ 删除失败: ${result.error}</span>`;
                }
            } catch (error) {
                resultEl.innerHTML = `<span class="error">✗ 请求失败: ${error.message}</span>`;
            }
        }
        
        async function verifyDeletion() {
            const resultEl = document.getElementById('verifyResult');
            
            if (testNodeHashes.length === 0) {
                resultEl.innerHTML = `<span class="error">✗ 请先执行删除操作</span>`;
                return;
            }
            
            resultEl.textContent = '正在验证删除结果...';
            
            try {
                const response = await fetch('https://home.liukun.com:8443/Projects/NodeLocalChecker/api/nodes.php?action=list');
                const result = await response.json();
                
                if (result.success) {
                    const nodes = result.nodes;
                    const remainingHashes = nodes.map(n => n.node_hash);
                    
                    let allDeleted = true;
                    const checkResults = [];
                    
                    testNodeHashes.forEach(hash => {
                        const exists = remainingHashes.includes(hash);
                        checkResults.push({
                            hash: hash,
                            deleted: !exists
                        });
                        if (exists) allDeleted = false;
                    });
                    
                    if (allDeleted) {
                        resultEl.innerHTML = `<span class="success">✓ 验证成功：所有测试节点已被删除</span>\n\n`;
                    } else {
                        resultEl.innerHTML = `<span class="error">✗ 验证失败：部分节点仍然存在</span>\n\n`;
                    }
                    
                    resultEl.innerHTML += `当前节点总数: ${nodes.length}\n\n`;
                    resultEl.innerHTML += `删除验证结果:\n`;
                    checkResults.forEach((r, i) => {
                        const status = r.deleted ? '<span class="success">✓ 已删除</span>' : '<span class="error">✗ 仍存在</span>';
                        resultEl.innerHTML += `${i + 1}. ${r.hash.substring(0, 16)}... ${status}\n`;
                    });
                } else {
                    resultEl.innerHTML = `<span class="error">✗ 获取失败: ${result.error}</span>`;
                }
            } catch (error) {
                resultEl.innerHTML = `<span class="error">✗ 请求失败: ${error.message}</span>`;
            }
        }
    </script>
</body>
</html>
