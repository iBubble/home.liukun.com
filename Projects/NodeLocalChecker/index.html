<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>节点本地检测工具 - Node Local Checker</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    
    <!-- 引入动画样式 -->
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/cyberpunk.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: #0a0a0a;
            color: #00ff41;
            min-height: 100vh;
            padding: 20px;
            position: relative;
        }

        /* 赛博朋克背景层 */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(ellipse at 20% 30%, rgba(10, 10, 30, 0.2) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 70%, rgba(20, 10, 30, 0.2) 0%, transparent 50%),
                linear-gradient(180deg, rgba(5, 5, 16, 0.3) 0%, rgba(10, 10, 21, 0.2) 50%, rgba(15, 15, 32, 0.2) 100%);
            z-index: -2;
        }

        /* 网格纹理 */
        body::after {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(0, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
            z-index: -1;
        }

        /* 扫描线效果 */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.15),
                rgba(0, 0, 0, 0.15) 1px,
                transparent 1px,
                transparent 2px
            );
            pointer-events: none;
            z-index: 1000;
            animation: scanline-move 8s linear infinite;
        }

        @keyframes scanline-move {
            0% { transform: translateY(0); }
            100% { transform: translateY(10px); }
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            background: rgba(10, 10, 10, 0.85);
            border-radius: 0;
            border: 2px solid #00ffff;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.3), inset 0 0 30px rgba(0, 255, 255, 0.1);
            overflow: hidden;
            position: relative;
        }

        .container::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, #00ffff, transparent);
            animation: scan-horizontal 3s linear infinite;
        }

        @keyframes scan-horizontal {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .header {
            background: rgba(0, 0, 0, 0.8);
            border-bottom: 2px solid #ff00ff;
            color: #00ffff;
            padding: 30px;
            text-align: center;
            position: relative;
            box-shadow: 0 0 20px rgba(255, 0, 255, 0.5);
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
            text-shadow: 0 0 10px #00ffff, 0 0 20px #00ffff;
            letter-spacing: 3px;
            animation: title-glow 2s ease-in-out infinite alternate;
        }

        @keyframes title-glow {
            from { text-shadow: 0 0 10px #00ffff, 0 0 20px #00ffff; }
            to { text-shadow: 0 0 20px #00ffff, 0 0 40px #00ffff, 0 0 60px #00ffff; }
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
            color: #ff00ff;
            text-shadow: 0 0 5px #ff00ff;
        }

        .main-content {
            padding: 30px;
            position: relative;
        }

        .upload-section {
            background: rgba(0, 20, 20, 0.5);
            border: 2px dashed #00ffff;
            border-radius: 0;
            padding: 40px;
            text-align: center;
            margin-bottom: 30px;
            transition: all 0.3s;
            position: relative;
            box-shadow: inset 0 0 20px rgba(0, 255, 255, 0.1);
        }

        .upload-section:hover {
            border-color: #ff00ff;
            background: rgba(20, 0, 20, 0.5);
            box-shadow: 0 0 20px rgba(255, 0, 255, 0.3), inset 0 0 20px rgba(255, 0, 255, 0.1);
        }

        .upload-section.dragover {
            background: rgba(0, 30, 30, 0.7);
            border-color: #00ff41;
            box-shadow: 0 0 30px rgba(0, 255, 65, 0.5);
        }

        .upload-section h3 {
            color: #00ffff;
            text-shadow: 0 0 10px #00ffff;
            margin-bottom: 15px;
        }

        .upload-section p {
            color: #00ff41;
            margin-bottom: 20px;
        }

        .upload-section a {
            color: #ff00ff;
            text-decoration: none;
            text-shadow: 0 0 5px #ff00ff;
        }

        .upload-section a:hover {
            color: #00ffff;
            text-shadow: 0 0 10px #00ffff;
        }

        .upload-btn {
            background: linear-gradient(135deg, #00ffff 0%, #ff00ff 100%);
            color: #000;
            border: none;
            padding: 12px 30px;
            border-radius: 0;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
            font-family: 'Courier New', monospace;
        }

        .upload-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 30px rgba(255, 0, 255, 0.8);
        }

        .file-input {
            display: none;
        }

        .stats-bar {
            display: flex;
            justify-content: space-around;
            background: rgba(0, 0, 0, 0.6);
            padding: 20px;
            border: 1px solid #00ffff;
            margin-bottom: 30px;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.2);
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-size: 32px;
            font-weight: bold;
            color: #00ffff;
            text-shadow: 0 0 10px #00ffff;
        }

        .stat-label {
            font-size: 14px;
            color: #00ff41;
            margin-top: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 10px 20px;
            border: 2px solid;
            border-radius: 0;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Courier New', monospace;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: bold;
        }

        .btn-primary {
            background: rgba(0, 255, 255, 0.1);
            color: #00ffff;
            border-color: #00ffff;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.3);
        }

        .btn-primary:hover {
            background: rgba(0, 255, 255, 0.2);
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.6);
            transform: translateY(-2px);
        }

        .btn-success {
            background: rgba(0, 255, 65, 0.1);
            color: #00ff41;
            border-color: #00ff41;
            box-shadow: 0 0 10px rgba(0, 255, 65, 0.3);
        }

        .btn-success:hover {
            background: rgba(0, 255, 65, 0.2);
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.6);
            transform: translateY(-2px);
        }

        .btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            transform: none;
        }

        .nodes-table {
            width: 100%;
            border-collapse: collapse;
            background: rgba(0, 0, 0, 0.5);
        }

        .nodes-table th,
        .nodes-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid rgba(0, 255, 255, 0.2);
        }

        .nodes-table th {
            position: sticky;
            top: 0;
            background: rgba(0, 20, 10, 0.95);
            font-weight: 600;
            color: #00ffff;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 2px solid #00ffff;
            text-shadow: 0 0 5px #00ffff;
            z-index: 10;
            box-shadow: 0 2px 10px rgba(0, 255, 65, 0.2);
        }

        .nodes-table tr:hover {
            background: rgba(0, 255, 255, 0.05);
        }

        /* 筛选栏样式 */
        .filter-bar {
            display: flex;
            gap: 30px;
            align-items: center;
            padding: 15px 20px;
            background: rgba(0, 255, 65, 0.05);
            border: 1px solid rgba(0, 255, 65, 0.2);
            border-radius: 8px;
            margin-top: 20px;
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.1);
        }

        .filter-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .filter-group label {
            color: #0ff;
            font-size: 14px;
            font-weight: 500;
            white-space: nowrap;
        }

        .filter-bar select {
            background: rgba(0, 0, 0, 0.6);
            color: #0ff;
            border: 1px solid rgba(0, 255, 255, 0.3);
            padding: 8px 15px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            cursor: pointer;
            min-width: 180px;
            transition: all 0.3s ease;
        }

        .filter-bar select:hover {
            border-color: rgba(0, 255, 255, 0.6);
            background: rgba(0, 255, 255, 0.1);
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.3);
        }

        .filter-bar select:focus {
            outline: none;
            border-color: #0ff;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.5);
        }

        /* 可滚动容器 */
        .nodes-container-wrapper {
            position: relative;
            border: 1px solid rgba(0, 255, 65, 0.2);
            border-radius: 8px;
            overflow: hidden;
            margin-top: 20px;
            box-shadow: 0 0 30px rgba(0, 255, 65, 0.1);
        }

        .scrollable-nodes {
            max-height: calc(10 * 50px + 47px); /* 10行 + 表头高度 */
            overflow-y: auto;
            overflow-x: hidden;
        }

        /* 滚动条样式 */
        .scrollable-nodes::-webkit-scrollbar {
            width: 12px;
        }

        .scrollable-nodes::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.3);
            border-left: 1px solid rgba(0, 255, 65, 0.2);
        }

        .scrollable-nodes::-webkit-scrollbar-thumb {
            background: rgba(0, 255, 65, 0.3);
            border-radius: 6px;
            border: 2px solid rgba(0, 0, 0, 0.3);
        }

        .scrollable-nodes::-webkit-scrollbar-thumb:hover {
            background: rgba(0, 255, 65, 0.5);
            box-shadow: 0 0 10px rgba(0, 255, 65, 0.5);
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 0;
            font-size: 12px;
            font-weight: 500;
            border: 1px solid;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .status-pending {
            background: rgba(255, 193, 7, 0.2);
            color: #ffc107;
            border-color: #ffc107;
            box-shadow: 0 0 10px rgba(255, 193, 7, 0.3);
        }

        .status-checking {
            background: rgba(0, 255, 255, 0.2);
            color: #00ffff;
            border-color: #00ffff;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
            animation: pulse 1s infinite;
        }

        .status-success {
            background: rgba(0, 255, 65, 0.2);
            color: #00ff41;
            border-color: #00ff41;
            box-shadow: 0 0 10px rgba(0, 255, 65, 0.5);
        }

        .status-failed {
            background: rgba(255, 0, 255, 0.2);
            color: #ff00ff;
            border-color: #ff00ff;
            box-shadow: 0 0 10px rgba(255, 0, 255, 0.3);
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid #00ffff;
            overflow: hidden;
            margin: 20px 0;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #00ffff 0%, #ff00ff 100%);
            transition: width 0.3s;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.8);
        }

        .checkbox {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #00ffff;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #00ff41;
        }

        .empty-state svg {
            width: 100px;
            height: 100px;
            margin-bottom: 20px;
            opacity: 0.3;
            fill: #00ffff;
        }

        .empty-state h3 {
            color: #00ffff;
            text-shadow: 0 0 10px #00ffff;
            margin-bottom: 10px;
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .stats-bar {
                flex-direction: column;
                gap: 20px;
            }

            .controls {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }
        }

        /* 更新历史弹窗 */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 10000;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: rgba(10, 10, 10, 0.95);
            border: 2px solid #00ffff;
            border-radius: 0;
            max-width: 800px;
            width: 90%;
            max-height: 80vh;
            overflow: hidden;
            box-shadow: 0 0 50px rgba(0, 255, 255, 0.5);
            display: flex;
            flex-direction: column;
        }

        .modal-header {
            padding: 20px;
            border-bottom: 2px solid #00ffff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.8);
        }

        .modal-header h2 {
            color: #00ffff;
            text-shadow: 0 0 10px #00ffff;
            margin: 0;
        }

        .modal-close {
            background: none;
            border: 2px solid #ff00ff;
            color: #ff00ff;
            font-size: 24px;
            width: 40px;
            height: 40px;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Courier New', monospace;
        }

        .modal-close:hover {
            background: rgba(255, 0, 255, 0.2);
            box-shadow: 0 0 20px rgba(255, 0, 255, 0.6);
        }

        .modal-body {
            padding: 20px;
            overflow-y: auto;
            flex: 1;
        }

        .update-log-item {
            background: rgba(0, 20, 20, 0.5);
            border: 1px solid rgba(0, 255, 255, 0.3);
            padding: 15px;
            margin-bottom: 15px;
            transition: all 0.3s;
        }

        .update-log-item:hover {
            border-color: #00ffff;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.3);
        }

        .log-time {
            color: #00ffff;
            font-size: 14px;
            margin-bottom: 10px;
            text-shadow: 0 0 5px #00ffff;
        }

        .log-source {
            color: #ff00ff;
            font-size: 12px;
            margin-bottom: 10px;
        }

        .log-stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-top: 10px;
        }

        .log-stat {
            text-align: center;
            padding: 8px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(0, 255, 255, 0.2);
        }

        .log-stat-value {
            font-size: 20px;
            font-weight: bold;
            color: #0f0;
            text-shadow: 0 0 5px #0f0;
        }

        .log-stat-label {
            font-size: 11px;
            color: #888;
            margin-top: 5px;
        }

        .empty-logs {
            text-align: center;
            padding: 40px;
            color: #888;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚀 节点本地检测工具</h1>
            <p>Node Local Checker - 检测机场聚合器节点的本地连通性和IP纯净度</p>
            <div id="clashStatus" style="margin-top: 15px; font-size: 14px;">
                <span style="color: #888;">正在检查 Clash 状态...</span>
            </div>
        </div>

        <div class="main-content">
            <!-- 上传区域 -->
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px;">
                <!-- 本地上传 -->
                <div class="upload-section" id="uploadSection">
                    <h3 style="margin-bottom: 15px;">📁 上传本地 YAML 文件</h3>
                    <p style="color: #888; margin-bottom: 20px; font-size: 14px;">
                        从本地选择或拖拽 Clash 配置文件
                    </p>
                    <input type="file" id="fileInput" class="file-input" accept=".yaml,.yml">
                    <button class="upload-btn" onclick="document.getElementById('fileInput').click()">
                        选择文件
                    </button>
                </div>

                <!-- 直接导入机场聚合器 -->
                <div class="upload-section" id="importSection">
                    <h3 style="margin-bottom: 15px;">🚀 导入机场聚合器配置</h3>
                    <p style="color: #888; margin-bottom: 20px; font-size: 14px;">
                        直接从 <a href="https://us.liukun.com:8443/Projects/Aggregator/" target="_blank" style="color: #0ff;">机场聚合器</a> 导入最新配置
                    </p>
                    <button class="upload-btn" onclick="importFromAggregator()" id="importBtn">
                        一键导入
                    </button>
                </div>
            </div>

            <!-- 统计信息 -->
            <div class="stats-bar" id="statsBar" style="display: none;">
                <div class="stat-item">
                    <div class="stat-value" id="totalNodes">0</div>
                    <div class="stat-label">总节点数</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="checkedNodes">0</div>
                    <div class="stat-label">已检测</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="availableNodes">0</div>
                    <div class="stat-label">可用节点</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="selectedNodes">0</div>
                    <div class="stat-label">已选择</div>
                </div>
            </div>

            <!-- 进度条 -->
            <div class="progress-bar" id="progressBar" style="display: none;">
                <div class="progress-fill" id="progressFill" style="width: 0%;"></div>
            </div>

            <!-- 控制按钮 -->
            <div class="controls" id="controls" style="display: none;">
                <button class="btn btn-primary" id="startCheckBtn" onclick="startCheck()">
                    开始检测选中节点
                </button>
                <button class="btn btn-success" id="exportBtn" onclick="exportSelected()">
                    导出选中节点
                </button>
                <button class="btn btn-primary" onclick="selectAll()">
                    全选
                </button>
                <button class="btn btn-primary" onclick="selectNone()">
                    取消全选
                </button>
                <button class="btn btn-primary" onclick="selectAvailable()">
                    选择可用节点
                </button>
                <button class="btn btn-primary" onclick="showUpdateHistory()" style="margin-left: auto;">
                    📊 更新历史
                </button>
            </div>

            <!-- 筛选和排序栏 -->
            <div class="filter-bar">
                <div class="filter-group">
                    <label>🌍 国家/地区:</label>
                    <select id="countryFilter" onchange="filterByCountry()">
                        <option value="all">所有国家/地区</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>📊 排序:</label>
                    <select id="sortOrder" onchange="sortNodes()">
                        <option value="latency">按延迟 (快→慢)</option>
                        <option value="name">按名称 (A→Z)</option>
                        <option value="country">按国家 (A→Z)</option>
                    </select>
                </div>
            </div>

            <!-- 节点列表 (可滚动) -->
            <div class="nodes-container-wrapper">
                <div id="nodesContainer" class="scrollable-nodes">
                    <div class="empty-state">
                        <svg viewBox="0 0 24 24" fill="currentColor">
                            <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/>
                        </svg>
                        <h3>暂无数据</h3>
                        <p>请上传 Clash YAML 配置文件开始检测</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 扫描线效果 -->
    <div class="scanlines"></div>

    <!-- 更新历史弹窗 -->
    <div class="modal-overlay" id="updateHistoryModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>📊 自动更新历史</h2>
                <button class="modal-close" onclick="closeUpdateHistory()">×</button>
            </div>
            <div class="modal-body" id="updateHistoryContent">
                <div class="empty-logs">加载中...</div>
            </div>
        </div>
    </div>

    <!-- 引入动画脚本 -->
    <script src="js/animations.js?v=20260205-8"></script>
    <script src="js/app.js?v=20260205-8"></script>
</body>
</html>
