<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>节点本地检测工具 - Node Local Checker</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    
    <!-- 引入动画样式 -->
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/cyberpunk.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: #0a0a0a;
            color: #00ff41;
            min-height: 100vh;
            padding: 15px;
            position: relative;
            font-size: 13px;
        }

        /* 赛博朋克背景层 */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(ellipse at 20% 30%, rgba(10, 10, 30, 0.2) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 70%, rgba(20, 10, 30, 0.2) 0%, transparent 50%),
                linear-gradient(180deg, rgba(5, 5, 16, 0.3) 0%, rgba(10, 10, 21, 0.2) 50%, rgba(15, 15, 32, 0.2) 100%);
            z-index: -2;
        }

        /* 网格纹理 */
        body::after {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(0, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
            z-index: -1;
        }

        /* 扫描线效果 */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.15),
                rgba(0, 0, 0, 0.15) 1px,
                transparent 1px,
                transparent 2px
            );
            pointer-events: none;
            z-index: 1000;
            animation: scanline-move 8s linear infinite;
        }

        @keyframes scanline-move {
            0% { transform: translateY(0); }
            100% { transform: translateY(10px); }
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            background: rgba(10, 10, 10, 0.85);
            border-radius: 0;
            border: none;
            box-shadow: none;
            overflow: hidden;
            position: relative;
        }

        .container::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, #00ffff, transparent);
            animation: scan-horizontal 3s linear infinite;
        }

        @keyframes scan-horizontal {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .header {
            background: rgba(0, 0, 0, 0.8);
            border-bottom: 2px solid #ff00ff;
            color: #00ffff;
            padding: 20px;
            text-align: center;
            position: relative;
            box-shadow: 0 0 20px rgba(255, 0, 255, 0.5);
        }

        .header h1 {
            font-size: 24px;
            margin-bottom: 8px;
            text-shadow: 0 0 10px #00ffff, 0 0 20px #00ffff;
            letter-spacing: 2px;
            animation: title-glow 2s ease-in-out infinite alternate;
        }

        @keyframes title-glow {
            from { text-shadow: 0 0 10px #00ffff, 0 0 20px #00ffff; }
            to { text-shadow: 0 0 20px #00ffff, 0 0 40px #00ffff, 0 0 60px #00ffff; }
        }

        .header p {
            font-size: 12px;
            opacity: 0.9;
            color: #ff00ff;
            text-shadow: 0 0 5px #ff00ff;
        }

        .main-content {
            padding: 20px;
            position: relative;
        }

        .upload-section {
            background: rgba(0, 20, 20, 0.5);
            border: 2px dashed #00ffff;
            border-radius: 0;
            padding: 25px;
            text-align: center;
            margin-bottom: 20px;
            transition: all 0.3s;
            position: relative;
            box-shadow: inset 0 0 20px rgba(0, 255, 255, 0.1);
        }

        .upload-section:hover {
            border-color: #ff00ff;
            background: rgba(20, 0, 20, 0.5);
            box-shadow: 0 0 20px rgba(255, 0, 255, 0.3), inset 0 0 20px rgba(255, 0, 255, 0.1);
        }

        .upload-section.dragover {
            background: rgba(0, 30, 30, 0.7);
            border-color: #00ff41;
            box-shadow: 0 0 30px rgba(0, 255, 65, 0.5);
        }

        .upload-section h3 {
            color: #00ffff;
            text-shadow: 0 0 10px #00ffff;
            margin-bottom: 10px;
            font-size: 16px;
        }

        .upload-section p {
            color: #00ff41;
            margin-bottom: 15px;
            font-size: 12px;
        }

        .upload-section a {
            color: #ff00ff;
            text-decoration: none;
            text-shadow: 0 0 5px #ff00ff;
        }

        .upload-section a:hover {
            color: #00ffff;
            text-shadow: 0 0 10px #00ffff;
        }

        .upload-btn {
            background: linear-gradient(135deg, #00ffff 0%, #ff00ff 100%);
            color: #000;
            border: none;
            padding: 8px 20px;
            border-radius: 0;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
            font-family: 'Courier New', monospace;
        }

        .upload-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 30px rgba(255, 0, 255, 0.8);
        }

        .file-input {
            display: none;
        }

        .stats-bar {
            display: flex;
            justify-content: space-around;
            background: rgba(0, 0, 0, 0.6);
            padding: 15px;
            border: 1px solid #00ffff;
            margin-bottom: 20px;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.2);
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #00ffff;
            text-shadow: 0 0 10px #00ffff;
        }

        .stat-label {
            font-size: 11px;
            color: #00ff41;
            margin-top: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 8px 15px;
            border: 2px solid;
            border-radius: 0;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Courier New', monospace;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: bold;
        }

        .btn-primary {
            background: rgba(0, 255, 255, 0.1);
            color: #00ffff;
            border-color: #00ffff;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.3);
        }

        .btn-primary:hover {
            background: rgba(0, 255, 255, 0.2);
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.6);
            transform: translateY(-2px);
        }

        .btn-success {
            background: rgba(0, 255, 65, 0.1);
            color: #00ff41;
            border-color: #00ff41;
            box-shadow: 0 0 10px rgba(0, 255, 65, 0.3);
        }

        .btn-success:hover {
            background: rgba(0, 255, 65, 0.2);
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.6);
            transform: translateY(-2px);
        }

        .btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            transform: none;
        }

        .nodes-table {
            width: 100%;
            border-collapse: collapse;
            background: rgba(0, 0, 0, 0.5);
        }

        .nodes-table th,
        .nodes-table td {
            padding: 8px 10px;
            text-align: left;
            border-bottom: 1px solid rgba(0, 255, 255, 0.2);
            font-size: 12px;
        }

        .nodes-table th {
            position: sticky;
            top: 0;
            background: rgba(0, 20, 10, 0.95);
            font-weight: 600;
            color: #00ffff;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 2px solid #00ffff;
            text-shadow: 0 0 5px #00ffff;
            z-index: 10;
            box-shadow: 0 2px 10px rgba(0, 255, 65, 0.2);
            font-size: 11px;
        }

        .nodes-table tr:hover {
            background: rgba(0, 255, 255, 0.05);
        }

        /* 筛选栏样式 */
        .filter-bar {
            display: flex;
            gap: 20px;
            align-items: center;
            padding: 10px 15px;
            background: rgba(0, 255, 65, 0.05);
            border: 1px solid rgba(0, 255, 65, 0.2);
            border-radius: 6px;
            margin-top: 15px;
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.1);
        }

        .filter-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .filter-group label {
            color: #0ff;
            font-size: 12px;
            font-weight: 500;
            white-space: nowrap;
        }

        .filter-bar select {
            background: rgba(0, 0, 0, 0.6);
            color: #0ff;
            border: 1px solid rgba(0, 255, 255, 0.3);
            padding: 6px 12px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            cursor: pointer;
            min-width: 160px;
            transition: all 0.3s ease;
        }

        .filter-bar select:hover {
            border-color: rgba(0, 255, 255, 0.6);
            background: rgba(0, 255, 255, 0.1);
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.3);
        }

        .filter-bar select:focus {
            outline: none;
            border-color: #0ff;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.5);
        }

        /* 可滚动容器 */
        .nodes-container-wrapper {
            position: relative;
            border: 1px solid rgba(0, 255, 65, 0.2);
            border-radius: 6px;
            overflow: hidden;
            margin-top: 15px;
            box-shadow: 0 0 30px rgba(0, 255, 65, 0.1);
        }

        .scrollable-nodes {
            max-height: calc(12 * 40px + 38px); /* 12行 + 表头高度 */
            overflow-y: auto;
            overflow-x: hidden;
        }

        /* 滚动条样式 */
        .scrollable-nodes::-webkit-scrollbar {
            width: 12px;
        }

        .scrollable-nodes::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.3);
            border-left: 1px solid rgba(0, 255, 65, 0.2);
        }

        .scrollable-nodes::-webkit-scrollbar-thumb {
            background: rgba(0, 255, 65, 0.3);
            border-radius: 6px;
            border: 2px solid rgba(0, 0, 0, 0.3);
        }

        .scrollable-nodes::-webkit-scrollbar-thumb:hover {
            background: rgba(0, 255, 65, 0.5);
            box-shadow: 0 0 10px rgba(0, 255, 65, 0.5);
        }

        .status-badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 0;
            font-size: 10px;
            font-weight: 500;
            border: 1px solid;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .status-pending {
            background: rgba(255, 193, 7, 0.2);
            color: #ffc107;
            border-color: #ffc107;
            box-shadow: 0 0 10px rgba(255, 193, 7, 0.3);
        }

        .status-checking {
            background: rgba(0, 255, 255, 0.2);
            color: #00ffff;
            border-color: #00ffff;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
        }

        .status-success {
            background: rgba(0, 255, 65, 0.2);
            color: #00ff41;
            border-color: #00ff41;
            box-shadow: 0 0 10px rgba(0, 255, 65, 0.5);
        }

        .status-failed {
            background: rgba(255, 0, 255, 0.2);
            color: #ff00ff;
            border-color: #ff00ff;
            box-shadow: 0 0 10px rgba(255, 0, 255, 0.3);
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid #00ffff;
            overflow: hidden;
            margin: 15px 0;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #00ffff 0%, #ff00ff 100%);
            transition: width 0.3s;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.8);
        }

        .checkbox {
            width: 16px;
            height: 16px;
            cursor: pointer;
            accent-color: #00ffff;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #00ff41;
        }

        .empty-state svg {
            width: 80px;
            height: 80px;
            margin-bottom: 15px;
            opacity: 0.3;
            fill: #00ffff;
        }

        .empty-state h3 {
            color: #00ffff;
            text-shadow: 0 0 10px #00ffff;
            margin-bottom: 8px;
            font-size: 16px;
        }
        
        .empty-state p {
            font-size: 12px;
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .stats-bar {
                flex-direction: column;
                gap: 20px;
            }

            .controls {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }
        }

        /* 更新历史弹窗 */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 10000;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: rgba(10, 10, 10, 0.95);
            border: 2px solid #00ffff;
            border-radius: 0;
            max-width: 800px;
            width: 90%;
            max-height: 80vh;
            overflow: hidden;
            box-shadow: 0 0 50px rgba(0, 255, 255, 0.5);
            display: flex;
            flex-direction: column;
        }

        .modal-header {
            padding: 15px;
            border-bottom: 2px solid #00ffff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.8);
        }

        .modal-header h2 {
            color: #00ffff;
            text-shadow: 0 0 10px #00ffff;
            margin: 0;
            font-size: 18px;
        }

        .modal-close {
            background: none;
            border: 2px solid #ff00ff;
            color: #ff00ff;
            font-size: 20px;
            width: 35px;
            height: 35px;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Courier New', monospace;
        }

        .modal-close:hover {
            background: rgba(255, 0, 255, 0.2);
            box-shadow: 0 0 20px rgba(255, 0, 255, 0.6);
        }

        .modal-body {
            padding: 15px;
            overflow-y: auto;
            flex: 1;
        }

        .update-log-item {
            background: rgba(0, 20, 20, 0.5);
            border: 1px solid rgba(0, 255, 255, 0.3);
            padding: 12px;
            margin-bottom: 12px;
            transition: all 0.3s;
        }

        .update-log-item:hover {
            border-color: #00ffff;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.3);
        }

        .log-time {
            color: #00ffff;
            font-size: 12px;
            margin-bottom: 8px;
            text-shadow: 0 0 5px #00ffff;
        }

        .log-source {
            color: #ff00ff;
            font-size: 11px;
            margin-bottom: 8px;
        }

        .log-stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-top: 8px;
        }

        .log-stat {
            text-align: center;
            padding: 6px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(0, 255, 255, 0.2);
        }

        .log-stat-value {
            font-size: 16px;
            font-weight: bold;
            color: #0f0;
            text-shadow: 0 0 5px #0f0;
        }

        .log-stat-label {
            font-size: 10px;
            color: #888;
            margin-top: 4px;
        }

        .empty-logs {
            text-align: center;
            padding: 30px;
            color: #888;
            font-size: 12px;
        }
        
        /* 检测进度动画弹窗 */
        .check-progress-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 20000;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: fade-in 0.3s ease;
        }
        
        .check-progress-modal {
            background: radial-gradient(circle, rgba(0, 20, 30, 0.95) 0%, rgba(0, 10, 20, 0.95) 100%);
            border: 3px solid #00ffff;
            border-radius: 50%;
            width: 600px;
            height: 600px;
            box-shadow: 0 0 50px rgba(0, 255, 255, 0.5),
                        inset 0 0 30px rgba(0, 255, 255, 0.1);
            position: relative;
            overflow: visible;
        }
        
        /* 同心圆容器 - 填满整个弹窗 */
        .concentric-circles-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .check-progress-modal::before {
            content: "";
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            border-radius: 50%;
            background: linear-gradient(45deg, transparent, #00ffff, transparent);
            animation: rotate-border 3s linear infinite;
            z-index: -1;
        }
        
        @keyframes rotate-border {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .progress-header {
            text-align: center;
            position: absolute;
            top: 40px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            width: 80%;
        }
        
        .progress-header h2 {
            font-size: 24px;
            color: #00ffff;
            text-shadow: 0 0 20px #00ffff;
            margin-bottom: 10px;
            animation: pulse-glow 2s ease-in-out infinite;
        }
        
        .progress-subtitle {
            font-size: 13px;
            color: #00ff41;
            opacity: 0.8;
        }
        
        .progress-visual {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        /* 雷达动画 - 作为背景层，半径为外框的2/3 (400px) */
        .radar-container {
            position: absolute;
            width: 400px;
            height: 400px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1;
        }
        
        .radar-circle {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border: 2px solid rgba(0, 255, 255, 0.3);
            border-radius: 50%;
            animation: pulse-glow 2s ease-in-out infinite;
        }
        
        .radar-circle-1 {
            width: 60%;
            height: 60%;
            animation-delay: 0s;
        }
        
        .radar-circle-2 {
            width: 80%;
            height: 80%;
            animation-delay: 0.3s;
        }
        
        .radar-circle-3 {
            width: 100%;
            height: 100%;
            animation-delay: 0.6s;
        }
        
        .radar-sweep {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 50%;
            height: 2px;
            background: linear-gradient(90deg, 
                rgba(0, 255, 255, 0) 0%, 
                rgba(0, 255, 255, 0.8) 50%, 
                rgba(0, 255, 255, 0) 100%);
            transform-origin: left center;
            animation: radar-scan 3s linear infinite;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.8);
        }
        
        .radar-center {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 10px;
            height: 10px;
            background: #00ffff;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 20px #00ffff;
            animation: pulse-glow 1s ease-in-out infinite;
        }
        
        /* 进度信息 */
        .progress-info {
            position: absolute;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            z-index: 10;
        }
        
        .progress-stats {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .stat-item-progress {
            text-align: center;
        }
        
        .stat-value-progress {
            font-size: 28px;
            font-weight: bold;
            color: #00ffff;
            text-shadow: 0 0 15px #00ffff;
            font-family: 'Courier New', monospace;
        }
        
        .stat-label-progress {
            font-size: 10px;
            color: #00ff41;
            margin-top: 5px;
            text-transform: uppercase;
        }
        
        .stat-divider {
            font-size: 28px;
            color: #00ffff;
            opacity: 0.5;
        }
        
        /* 环形进度条 - 位于雷达动画上层，半径为外框的1/3 (200px) */
        .progress-bar-container {
            position: absolute;
            width: 200px;
            height: 200px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 2;
        }
        
        .circular-progress {
            transform: rotate(-90deg);
        }
        
        .circular-progress-bg {
            fill: none;
            stroke: rgba(0, 0, 0, 0.5);
            stroke-width: 15;
        }
        
        .circular-progress-bar {
            fill: none;
            stroke: url(#progressGradient);
            stroke-width: 15;
            stroke-linecap: round;
            stroke-dasharray: 565.48;
            stroke-dashoffset: 565.48;
            transition: stroke-dashoffset 0.3s ease;
            filter: drop-shadow(0 0 10px rgba(0, 255, 255, 0.8));
        }
        
        .progress-percentage {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 32px;
            font-weight: bold;
            color: #00ffff;
            text-shadow: 0 0 20px #00ffff;
            z-index: 1;
            font-family: 'Courier New', monospace;
        }
        
        .progress-details {
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-width: 400px;
            margin: 0 auto;
        }
        
        .detail-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
        }
        
        .detail-label {
            color: #00ffff;
        }
        
        .detail-value {
            color: #00ff41;
            font-weight: bold;
            font-family: 'Courier New', monospace;
        }
        
        .detail-value.success {
            color: #0f0;
            text-shadow: 0 0 5px #0f0;
        }
        
        .detail-value.failed {
            color: #f00;
            text-shadow: 0 0 5px #f00;
        }
        
        @keyframes fade-in {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        @keyframes radar-scan {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        @keyframes pulse-glow {
            0%, 100% {
                box-shadow: 0 0 5px rgba(0, 255, 255, 0.5);
                opacity: 0.6;
            }
            50% {
                box-shadow: 0 0 20px rgba(0, 255, 255, 0.8);
                opacity: 1;
            }
        }
        
        @keyframes gradient-shift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        /* 响应式 */
        @media (max-width: 768px) {
            .check-progress-modal {
                width: 90vw;
                height: 90vw;
                max-width: 500px;
                max-height: 500px;
            }
            
            .progress-header {
                top: 30px;
            }
            
            .radar-container {
                width: 66.67vw;
                height: 66.67vw;
                max-width: 333px;
                max-height: 333px;
            }
            
            .progress-bar-container {
                width: 33.33vw;
                height: 33.33vw;
                max-width: 167px;
                max-height: 167px;
            }
            
            .progress-bar-container svg {
                width: 100%;
                height: 100%;
            }
            
            .progress-percentage {
                font-size: 20px;
            }
            
            .stat-value-progress {
                font-size: 20px;
            }
            
            .stat-label-progress {
                font-size: 9px;
            }
            
            .progress-info {
                bottom: 40px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚀 节点本地检测工具</h1>
            <p>Node Local Checker - 检测机场聚合器节点的本地连通性和IP纯净度</p>
            <div id="clashStatus" style="margin-top: 10px; font-size: 12px;">
                <span style="color: #888;">正在检查 Clash 状态...</span>
            </div>
        </div>

        <div class="main-content">
            <!-- 上传区域 -->
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px;">
                <!-- 本地上传 -->
                <div class="upload-section" id="uploadSection">
                    <h3 style="margin-bottom: 10px;">📁 上传本地 YAML 文件</h3>
                    <p style="color: #888; margin-bottom: 15px; font-size: 12px;">
                        从本地选择或拖拽 Clash 配置文件
                    </p>
                    <input type="file" id="fileInput" class="file-input" accept=".yaml,.yml">
                    <button class="upload-btn" onclick="document.getElementById('fileInput').click()">
                        选择文件
                    </button>
                </div>

                <!-- 直接导入机场聚合器 -->
                <div class="upload-section" id="importSection">
                    <h3 style="margin-bottom: 10px;">🚀 导入机场聚合器配置</h3>
                    <p style="color: #888; margin-bottom: 15px; font-size: 12px;">
                        直接从 <a href="https://us.liukun.com:8443/Projects/Aggregator/" target="_blank" style="color: #0ff;">机场聚合器</a> 导入最新配置
                    </p>
                    <button class="upload-btn" onclick="importFromAggregator()" id="importBtn">
                        一键导入
                    </button>
                </div>
            </div>

            <!-- 统计信息 -->
            <div class="stats-bar" id="statsBar" style="display: none;">
                <div class="stat-item">
                    <div class="stat-value" id="totalNodes">0</div>
                    <div class="stat-label">总节点数</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="checkedNodes">0</div>
                    <div class="stat-label">已检测</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="availableNodes">0</div>
                    <div class="stat-label">可用节点</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="selectedNodes">0</div>
                    <div class="stat-label">已选择</div>
                </div>
            </div>

            <!-- 进度条 -->
            <div class="progress-bar" id="progressBar" style="display: none;">
                <div class="progress-fill" id="progressFill" style="width: 0%;"></div>
            </div>

            <!-- 控制按钮 -->
            <div class="controls" id="controls" style="display: none;">
                <button class="btn btn-primary" id="startCheckBtn" onclick="startCheck()">
                    开始检测选中节点
                </button>
                <button class="btn btn-primary" onclick="selectAll()">
                    全选
                </button>
                <button class="btn btn-primary" onclick="selectNone()">
                    取消全选
                </button>
                <button class="btn btn-primary" onclick="selectAvailable()">
                    选择可用节点
                </button>
                <button class="btn btn-primary" onclick="deleteSelectedNodes()" title="删除选中的节点">
                    🗑️ 清除所选节点
                </button>
                <button class="btn btn-primary" onclick="showUpdateHistory()">
                    📊 更新历史
                </button>
                <button class="btn btn-success" id="exportBtn" onclick="exportSelected()" style="margin-left: auto;">
                    &#x2B07; 导出选中节点
                </button>
            </div>

            <!-- 筛选和排序栏 -->
            <div class="filter-bar">
                <div class="filter-group">
                    <label>🌍 国家/地区:</label>
                    <select id="countryFilter" onchange="filterByCountry()">
                        <option value="all">所有国家/地区</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>📊 排序:</label>
                    <select id="sortOrder" onchange="sortNodes()">
                        <option value="latency">按延迟 (快→慢)</option>
                        <option value="purity">按纯净度 (高→低)</option>
                        <option value="name">按名称 (A→Z)</option>
                        <option value="country">按国家 (A→Z)</option>
                    </select>
                </div>
            </div>

            <!-- 节点列表 (可滚动) -->
            <div class="nodes-container-wrapper">
                <div id="nodesContainer" class="scrollable-nodes">
                    <div class="empty-state">
                        <svg viewBox="0 0 24 24" fill="currentColor">
                            <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/>
                        </svg>
                        <h3>暂无数据</h3>
                        <p>请上传 Clash YAML 配置文件开始检测</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 扫描线效果 -->
    <div class="scanlines"></div>

    <!-- 检测进度动画弹窗 -->
    <div class="check-progress-overlay" id="checkProgressOverlay" style="display: none;">
        <div class="check-progress-modal">
            <!-- 标题 -->
            <div class="progress-header">
                <h2>🚀 节点检测中</h2>
                <div class="progress-subtitle">正在并发检测节点连通性和IP纯净度...</div>
            </div>
            
            <!-- 同心圆容器 -->
            <div class="concentric-circles-container">
                <div class="progress-visual">
                    <!-- 雷达扫描动画 (背景层，半径400px) -->
                    <div class="radar-container">
                        <div class="radar-circle radar-circle-1"></div>
                        <div class="radar-circle radar-circle-2"></div>
                        <div class="radar-circle radar-circle-3"></div>
                        <div class="radar-sweep"></div>
                        <div class="radar-center"></div>
                    </div>
                    
                    <!-- 环形进度条 (前景层，半径200px) -->
                    <div class="progress-bar-container">
                        <svg class="circular-progress" width="200" height="200" viewBox="0 0 200 200">
                            <defs>
                                <linearGradient id="progressGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                                    <stop offset="0%" style="stop-color:#00ffff;stop-opacity:1" />
                                    <stop offset="50%" style="stop-color:#00ff41;stop-opacity:1" />
                                    <stop offset="100%" style="stop-color:#00ffff;stop-opacity:1" />
                                </linearGradient>
                            </defs>
                            <circle class="circular-progress-bg" cx="100" cy="100" r="90"></circle>
                            <circle class="circular-progress-bar" id="progressCircle" cx="100" cy="100" r="90"></circle>
                        </svg>
                        <div class="progress-percentage" id="progressPercentage">0%</div>
                    </div>
                </div>
            </div>
            
            <!-- 进度信息 -->
            <div class="progress-info">
                <div class="progress-stats">
                    <div class="stat-item-progress">
                        <div class="stat-value-progress" id="progressChecked">0</div>
                        <div class="stat-label-progress">已检测</div>
                    </div>
                    <div class="stat-divider">/</div>
                    <div class="stat-item-progress">
                        <div class="stat-value-progress" id="progressTotal">0</div>
                        <div class="stat-label-progress">总数</div>
                    </div>
                </div>
                
                <div class="progress-details">
                    <div class="detail-row">
                        <span class="detail-label">✓ 可用节点:</span>
                        <span class="detail-value success" id="progressAvailable">0</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">✗ 不可用:</span>
                        <span class="detail-value failed" id="progressFailed">0</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">⏱ 预计剩余:</span>
                        <span class="detail-value" id="progressETA">计算中...</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 更新历史弹窗 -->
    <div class="modal-overlay" id="updateHistoryModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>📊 自动更新历史</h2>
                <button class="modal-close" onclick="closeUpdateHistory()">×</button>
            </div>
            <div class="modal-body" id="updateHistoryContent">
                <div class="empty-logs">加载中...</div>
            </div>
        </div>
    </div>

    <!-- 引入动画脚本 -->
    <script src="js/animations.js?v=20260205-17"></script>
    <script src="js/app.js?v=20260205-17"></script>
</body>
</html>
