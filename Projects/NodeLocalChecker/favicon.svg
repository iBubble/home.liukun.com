<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="rocketGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff00ff;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- 背景 -->
  <rect width="100" height="100" fill="#0a0a0a" rx="15"/>
  
  <!-- 火箭尾焰 -->
  <ellipse cx="50" cy="75" rx="8" ry="12" fill="#ff00ff" opacity="0.6" filter="url(#glow)"/>
  <ellipse cx="50" cy="78" rx="6" ry="10" fill="#00ffff" opacity="0.8" filter="url(#glow)"/>
  
  <!-- 火箭主体 -->
  <path d="M 50 20 L 60 50 L 60 65 L 50 70 L 40 65 L 40 50 Z" 
        fill="url(#rocketGradient)" 
        stroke="#00ffff" 
        stroke-width="1.5"
        filter="url(#glow)"/>
  
  <!-- 火箭头部 -->
  <path d="M 50 20 L 40 50 L 60 50 Z" 
        fill="#00ffff" 
        opacity="0.8"
        filter="url(#glow)"/>
  
  <!-- 火箭窗口 -->
  <circle cx="50" cy="45" r="5" fill="#0a0a0a" stroke="#00ffff" stroke-width="1"/>
  <circle cx="50" cy="45" r="3" fill="#00ffff" opacity="0.5"/>
  
  <!-- 火箭侧翼 -->
  <path d="M 40 50 L 30 60 L 35 65 L 40 60 Z" 
        fill="#ff00ff" 
        stroke="#00ffff" 
        stroke-width="1"
        opacity="0.8"/>
  <path d="M 60 50 L 70 60 L 65 65 L 60 60 Z" 
        fill="#ff00ff" 
        stroke="#00ffff" 
        stroke-width="1"
        opacity="0.8"/>
  
  <!-- 装饰线条 -->
  <line x1="45" y1="55" x2="45" y2="65" stroke="#00ffff" stroke-width="1" opacity="0.6"/>
  <line x1="55" y1="55" x2="55" y2="65" stroke="#00ffff" stroke-width="1" opacity="0.6"/>
  
  <!-- 星星装饰 -->
  <circle cx="20" cy="25" r="1.5" fill="#00ffff" opacity="0.8"/>
  <circle cx="80" cy="30" r="1" fill="#ff00ff" opacity="0.8"/>
  <circle cx="75" cy="45" r="1.5" fill="#00ffff" opacity="0.6"/>
  <circle cx="25" cy="40" r="1" fill="#ff00ff" opacity="0.6"/>
</svg>
