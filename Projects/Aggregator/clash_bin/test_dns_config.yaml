    tfo: true
    skip-cert-verify: true
    uuid: 6202b230-417c-4d8e-b624-0f71afa9c75d
    network: ws
    tls: true
    servername: sni.111000.indevs.in
    udp: true
    ws-opts:
      path: /?ed=2560fp=chrome
      headers:
        Host: sni.111000.indevs.in
proxy-groups:
